<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Path</title>
    <style>
        /* This styles the Front Door page */
        body {
            background-color: #121212;
            color: #f4f4f4;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 3rem; margin-bottom: 10px; font-weight: normal; }
        p { font-size: 1.2rem; color: #a0a0a0; margin-bottom: 40px; }
        
        .container { display: flex; gap: 30px; }
        
        .portal-button {
            text-decoration: none;
            color: inherit;
            border: 1px solid #555;
            padding: 30px;
            width: 250px;
            border-radius: 10px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.02);
        }
        
        .portal-button:hover {
            border-color: #d4af37; /* Gold color */
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        
        .portal-button h2 { margin-top: 0; color: #d4af37; font-weight: normal; }
        .portal-button p { font-size: 0.9rem; margin-bottom: 0; }
    </style>
</head>
<body>

    <h1>Two Worlds Await.</h1>
    <p>Where would you like to go?</p>
    
    <div class="container">
        <!-- This links to your OLD cozy website -->
        <a href="index.html" class="portal-button">
            <h2>The Quiet Corner</h2>
            <p>A cozy little place for gentle thoughts.</p>
        </a>
        
        <!-- This links to your NEW dark website -->
        <a href="midnight-library.html" class="portal-button">
            <h2>The Midnight Library</h2>
            <p>A dark collection of rooms and quiet secrets.</p>
        </a>
    </div>

</body>
</html>
